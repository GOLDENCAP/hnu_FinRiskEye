# 第三级风险服务 HTTPS 反向代理示例（nginx）
#
# 放置位置：Linux 放到 /etc/nginx/conf.d/finriskeye-risk.conf；
# Windows 原生 nginx 放到 conf/conf.d/ 下（证书路径按实际修改）。
# 使用前请替换：
#   - server_name risk.example.com -> 你的域名；
#   - ssl_certificate / ssl_certificate_key -> 真实证书路径；
#   - upstream 127.0.0.1:3100 -> 风险服务实际地址（docker 端口映射后仍是本机 3100）。
#
# 说明：Android 现有客户端默认使用 http://<局域网IP>:3100 且未配置自签证书信任，
# 教学演示可继续走 HTTP；HTTPS 主要用于公网/生产部署，届时 Android 需改为 https
# 并信任对应 CA（或使用受信任的公网证书）。

upstream thirdlevel_risk_service {
    server 127.0.0.1:3100;
    keepalive 16;
}

# nginx 层粗粒度限流（应用层 RATE_LIMIT_PER_MINUTE 是主限流，这里是兜底）。
# 每 IP 每分钟 120 次，突发 20；应用层默认 60 次/分钟/（令牌+IP）。
limit_req_zone $binary_remote_addr zone=risk_api:10m rate=120r/m;

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name risk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # nginx >= 1.25.1 可改为：listen 443 ssl; http2 on;
    server_name risk.example.com;

    # ===== TLS 证书占位（部署时替换为真实路径）=====
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ===== 请求体与超时 =====
    # 画面接口：图片最大 6MB，base64 后约 8MB，留 9m 余量。
    client_max_body_size 9m;
    # 风险分析单次最长约 15 秒（Android 客户端超时 15s），反代留足余量避免 504。
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 传给应用做日志关联；应用也会回显 X-Request-Id。
    proxy_set_header X-Request-Id $request_id;

    # 健康检查：不限流、不写访问日志。
    location = /health {
        access_log off;
        proxy_pass http://thirdlevel_risk_service;
    }

    # 分析接口：另加 nginx 层限流兜底；超限返回 429。
    # !! 应用按 (Bearer 令牌 + 客户端 IP) 限流，经反代后客户端 IP 来自
    #    X-Forwarded-For，需在服务端 .env 设置 TRUST_PROXY=1。
    location /api/v1/risk/ {
        limit_req zone=risk_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://thirdlevel_risk_service;
    }

    # 其余路径一律 404。
    location / {
        return 404;
    }
}
